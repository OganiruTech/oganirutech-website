; Supervisor config for the Oganiru queue worker.
;
; Install:
;   sudo cp deploy/oganiru-queue-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start oganiru-worker:*
;
; Check:   sudo supervisorctl status oganiru-worker:*
; Logs:    tail -f /var/log/oganiru-worker.log
;
; NOTE: the php binary below must be 8.2 — the version php-fpm serves this
; site with. Running the worker on a different PHP than the app is exactly
; the class of mismatch that caused the "could not find driver" outage.

[program:oganiru-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.2 /var/www/oganiru-repo/backend/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=60
directory=/var/www/oganiru-repo/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/oganiru-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
